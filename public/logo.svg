<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f74b8"/>
      <stop offset="0.55" stop-color="#9cc0e8"/>
      <stop offset="1" stop-color="#f4f8fd"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9aa6b5"/>
      <stop offset="1" stop-color="#e8edf3"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>

  <!-- Sky with soft clouds -->
  <circle cx="100" cy="100" r="96" fill="url(#sky)"/>
  <g clip-path="url(#disc)" fill="#ffffff">
    <ellipse cx="38" cy="170" rx="46" ry="22" opacity="0.9"/>
    <ellipse cx="96" cy="182" rx="60" ry="24"/>
    <ellipse cx="164" cy="166" rx="44" ry="22" opacity="0.9"/>
    <ellipse cx="150" cy="40" rx="34" ry="9" opacity="0.35"/>
    <ellipse cx="44" cy="58" rx="28" ry="7" opacity="0.3"/>
  </g>

  <!-- UVA lettering: black with a chrome edge, italic -->
  <g transform="translate(100 69) scale(1.2) translate(-100 -77) translate(16 0) skewX(-12)" fill="#0b0d12" stroke="url(#chrome)" stroke-width="2.6" stroke-linejoin="round">
    <path d="M40 52 h13 v30 q0 7 5 7 q5 0 5 -7 v-30 h13 v32 q0 18 -18 18 q-18 0 -18 -18 z"/>
    <path d="M82 52 h14 l4 30 l4 -30 h14 l-12 50 h-12 z"/>
    <path d="M124 102 l12 -50 h12 l12 50 h-14 l-4 -20 l-4 20 z"/>
  </g>

  <!-- P-51, head-on -->
  <g transform="translate(100 140) scale(0.82) translate(-100 -130)">
    <path d="M100 104 L97 122 L103 122 Z" fill="#1b2130"/>
    <path d="M24 129 L100 124.5 L176 129 L176 132.5 L100 135.5 L24 132.5 Z" fill="#2a3242"/>
    <g fill="#f4f6f9">
      <rect x="44" y="127.4" width="4" height="5.4"/>
      <rect x="52" y="127" width="4" height="5.8"/>
      <rect x="144" y="127" width="4" height="5.8"/>
      <rect x="152" y="127.4" width="4" height="5.4"/>
    </g>
    <line x1="90" y1="136" x2="85" y2="150" stroke="#1b2130" stroke-width="2.5"/>
    <line x1="110" y1="136" x2="115" y2="150" stroke="#1b2130" stroke-width="2.5"/>
    <circle cx="85" cy="151" r="3.2" fill="#1b2130"/>
    <circle cx="115" cy="151" r="3.2" fill="#1b2130"/>
    <g stroke="#11151d" stroke-width="3.6" stroke-linecap="round">
      <line x1="83" y1="113" x2="117" y2="147"/>
      <line x1="117" y1="113" x2="83" y2="147"/>
    </g>
    <circle cx="100" cy="130" r="10" fill="#f2c230" stroke="#11151d" stroke-width="2"/>
    <circle cx="100" cy="130" r="3.5" fill="#11151d"/>
  </g>
</svg>
