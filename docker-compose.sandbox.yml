# Sandbox stack: the same as docker-compose.yml (production), so both can run on one server.
# Differences: Postgres listens on 127.0.0.1:5433 instead of 5432. Keep the two files in step.
# Configure with its own .env (its own tunnel token, secrets and SITE_URL).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: club
    # Reachable only from the server itself, for an SSH tunnel (see README "Database access").
    # Keep the 127.0.0.1: Docker bypasses ufw, so a bare "5432:5432" would be public.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://club:${POSTGRES_PASSWORD}@db:5432/club
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SITE_URL: ${SITE_URL:-}
      # Enables the /api/seed import endpoints while set (see README). Leave empty normally.
      SEED_API_TOKEN: ${SEED_API_TOKEN:-}
    volumes:
      - uploads:/data/uploads

  # Outbound connection to Cloudflare. Cloudflare terminates HTTPS and forwards
  # requests through the tunnel to http://app:3000 (set in the Cloudflare dashboard).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}

  # Once a day: dump the database and archive uploads into ./backups, keeping 14 days.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: club
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: club
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]

volumes:
  pgdata:
  uploads:
